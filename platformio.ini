; Standalone book-reader firmware for the Elecrow CrowPanel 4.2"
; (green-sticker V1.2A, ESP32-S3-N8R8, SSD1683 400x300).
;
; Display uses the legacy SSD1683 command sequence this panel answers to
; (src/vendor/EPD.cpp, see docs/screen-bringup.md).
;
;   cd firmware_reader && pio run -t upload && pio device monitor

[env:crowpanel_reader]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32s3
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.embed_txtfiles = src/book.txt
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0 ; USB-C goes to a UART bridge on this board
  -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b ; pinned
  ricmoo/QRCode @ 0.0.1
